version: 0.0.0.1
type: test-suite
suite-name: parser
list-root: ${ARKCOMPILER_ETS_FRONTEND_PATH}/ets2panda/test/test-lists/parser
test-root: ${parameters.parser-root}

parameters:
  validator: runner.extensions.validators.parser.parser_validator.ParserValidator
  parser-root: ${ARKCOMPILER_ETS_FRONTEND_PATH}/ets2panda/test
  work-dir: ${WORK_DIR}/${suite-name}
  enable-verifier: false
  build: ${PANDA_BUILD}
  with-js: false

collections:
  #  js tests
  ark_tests:
    parameters:
      extension: js
      es2panda-workflow-args:
        - "--dump-ast"
        - "--extension=${parameters.extension}"
        - "--thread=0"
        - "--parse-only"
  parser/js:
    parameters:
      extension: js
      es2panda-workflow-args:
        - "--dump-ast"
        - "--extension=${parameters.extension}"
        - "--thread=0"
        - "--parse-only"
  compiler/js:
    parameters:
      extension: js
      es2panda-workflow-args:
        - "--dump-ast"
        - "--extension=${parameters.extension}"
        - "--thread=0"
  #  ts tests
  parser/ts:
    parameters:
      extension: ts
      es2panda-workflow-args:
        - "--dump-ast"
        - "--extension=${parameters.extension}"
        - "--thread=0"
        - "--parse-only"
  compiler/ts:
    parameters:
      extension: ts
      es2panda-workflow-args:
        - "--dump-ast"
        - "--extension=${parameters.extension}"
        - "--thread=0"
  # as/ts tests
  parser/as:
    parameters:
      extension: ts
      es2panda-workflow-args:
        - "--dump-ast"
        - "--extension=${parameters.extension}"
        - "--thread=0"
        - "--parse-only"
  # ets tests
  compiler/ets:
    parameters:
      extension: ets
      es2panda-test-suite-args:
        - "--dump-ast"
        - "--thread=0"
  parser/ets:
    parameters:
      extension: ets
      es2panda-test-suite-args:
        - "--dump-ast"
        - "--thread=0"
