version: 0.0.0.1
type: test-suite
suite-name: recheck
test-root: ${ARKCOMPILER_ETS_FRONTEND_PATH}/ets2panda/test/
list-root: ${ARKCOMPILER_ETS_FRONTEND_PATH}/ets2panda/test/test-lists/recheck

parameters:
  validator: runner.extensions.validators.return_0_validator.Return0Validator
  work-dir: ${WORK_DIR}/${suite-name}
  build: ${PANDA_BUILD}
  enable-verifier: false
  extension: ets
  use-metadata: false
  es2panda-workflow-args:
    - '--thread=0'
    - '--extension=${parameters.extension}'
    - '--plugins=e2p_test_plugin_recheck'
    - '--exit-after-phase'
    - 'plugins-after-check'
    - '--arktsconfig=${parameters.arktsconfig}'
    - '--output=/dev/null'

collections:
  compiler/ets: >-
  parser/ets: >-
  runtime/ets: >-
  ast: >-
