---
cases:
  - defs: |-
      function foo() {}
      function foo(): void {}
    tags: "compile-only, negative"

  - defs: |-
      function foo(): void {}
      function foo(): void {}
    tags: "compile-only, negative"

  - defs: |-
      function foo(): int {
        return 0;
      }
      native function foo(): void;
    tags: "compile-only, negative"

  - defs: |-
      function foo(): int {
        return 0;
      }
      function foo(): short {
        return 0 as short;
      }
    tags: "compile-only, negative"

  - defs: |-
      function foo(... a: byte): void {}
      native function foo(... b: byte): long;
    tags: "compile-only, negative"

  - defs: |-
      function foo<T, U>(a: T, b: U): T {
        return a;
      }
      function foo<V, T>(a: V, b: T): V {
        return a;
      }
    tags: "compile-only, negative"

  - defs: |-
      function foo<T, U>(a: T, b: U): T {
        return a;
      }
      function foo<V, T>(a: V, b: T): int {
        return 1;
      }
    tags: "compile-only, negative"

  - defs: |-
      interface I {}
      interface J {}
      class A implements I, J {}

      function foo(a: I): int {
          return 1;
      }
      function foo(a: J): int {
          return 2;
      }
    use: |-
      let i: int = foo(new A());
      arktest.assertEQ(i, 1);

  - defs: |-
      class A {}
      class B {}

      function foo(a: A|null): int {
          return 1;
      }
      function foo(a: B|null): int {
          return 2;
      }
    use: |-
      let i: int = foo(null);
      arktest.assertEQ(i, 1);

  - defs: |-
      function foo(...p: int[]): int {
          return 1;
      }
      function foo(...p: boolean[]): int {
          return 2;
      }
    use: |-
      let i: int = foo(1, true)
    tags: "compile-only, negative"

  - defs: |-
      function foo(...p: int[]): int {
          return 1;
      }
      function foo(...p: boolean[]): int {
          return 2;
      }
    use: |-
      let i: int = foo()
    tags: "compile-only, negative"

  - defs: |-
      function foo(...p: int[]): int {
          return 1;
      }
      function foo(...p: long[]): int {
          return 2;
      }
    use: |-
      let i: int = foo()
    tags: "compile-only, negative"

  - defs: |-
       function foo(...p: int[]): int {
           return 1;
       }
       function foo(...p: boolean[]): int {
           return 2;
       }
    use: |-
      let i: int = foo()
    tags: "compile-only, negative"

  - defs: |-
      function foo(...p: float[]): int {
          return 1;
      }
      function foo(...p: double[]): int {
          return 2;
      }
    use: |-
      let i: int = foo()
    tags: "compile-only, negative"
