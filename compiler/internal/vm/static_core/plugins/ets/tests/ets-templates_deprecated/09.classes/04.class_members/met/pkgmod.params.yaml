---
cases:
    # internal access modifier, same-package cases
    - files: './pkg_int_A1/file_A.ets'
      tags: 'compile-only, negative'
      decl: |-
          import { A } from './pkg_int_A1';
      use: |-
          // package module, negative case with internal method
          arktest.assertEQ( new A().foo(42), 84 )

    - files: './pkg_int_A1/file_A.ets'
      decl: |-
          import { C } from './pkg_int_A1';
      use: |-
          // package module, positive case with internal method, from same-package subclass
          arktest.assertEQ( new C().foo(42), 94 )

    - files: './pkg_int_A1/file_A.ets'
      tags: 'compile-only, negative'
      decl: |-
          import { D } from './pkg_int_A1';
      use: |-
          // package module, negative case with internal method, from same-package subclass
          arktest.assertEQ( new D().foo(42), 84 )

    - files: './pkg_int_A2/file_A.ets, ./pkg_int_A2/file_B.ets'
      decl: |-
          import { B } from './pkg_int_A2';
      use: |-
          // package module, positive case with internal method, from same-package subclass
          arktest.assertEQ( new B().foo(42), 184 )

    - files: './pkg_int_A2/file_A.ets, ./pkg_int_A2/file_B.ets'
      tags: 'compile-only, negative'
      decl: |-
          import { F } from './pkg_int_A2';
      use: |-
          // package module, negative case with internal method, from same-package subclass
          arktest.assertEQ( new F().foo(42), 84 )

    # internal access modifier, other-package cases
    - files: './pkg_int_A1/file_A.ets, ./pkg_int_B1/file.ets'
      tags: 'compile-only, negative'
      decl: |-
          import { K } from './pkg_int_B1';
      use: |-
          // package module, negative case with internal method, from other-package subclass
          arktest.assertEQ( new K().foo(42), 104 )

    - files: './pkg_int_A1/file_A.ets, ./pkg_int_B2/file.ets'
      tags: 'compile-only, negative'
      decl: |-
          import { L } from './pkg_int_B2';
      use: |-
          // package module, negative case with internal method, from other-package subclass
          arktest.assertEQ( new L().foo(42), 84 )

    - files: './pkg_int_A1/file_A.ets, ./pkg_int_B3/file.ets'
      decl: |-
          import { M } from './pkg_int_B3';
      use: |-
          // package module, positive case with internal method, from other-package subclass
          arktest.assertEQ( new M().foo(42), 95 )

    - files: './pkg_int_A1/file_A.ets, ./pkg_int_B4/file.ets'
      decl: |-
          import { N } from './pkg_int_B4';
      use: |-
          // package module, positive case with internal method, from other-package subclass
          arktest.assertEQ( new N().foo(42), 94 )
