---
cases:
    - call: |-
          // Object
          arktest.assertEQ(foo(o), "Object")     // Array<Object> <: Object
          arktest.assertEQ(foo(a), "AObject")    // Array<A> <: Object
          arktest.assertEQ(foo(b), "BObject")    // Array<B> <: Object

          // Array<A>
          arktest.assertEQ(foo(a, 0), "AObject")

          // Array<B>
          arktest.assertEQ(foo(b, 0, 0), "BObject")

          // Array<A>|Array<B>
          arktest.assertEQ(foo(a, 0, 0, 0, 0), "AObject")  // Array<A> <: Array<A>|Array<B>
          arktest.assertEQ(foo(b, 0, 0, 0, 0), "BObject")  // Array<B> <: Array<A>|Array<B>

          // Array<Object>
          arktest.assertEQ(foo(o, 0, 0, 0, 0, 0), "Object")

    - tags: 'compile-only, negative'
      call: |-
          foo(o, 0) // CTE: No such signature

    - tags: 'compile-only, negative'
      call: |-
          foo(b, 0) // CTE: No such signature

    - tags: 'compile-only, negative'
      call: |-
          foo(o, 0, 0) // CTE: No such signature

    - tags: 'compile-only, negative'
      call: |-
          foo(a, 0, 0) // CTE: No such signature

    - tags: 'compile-only, negative'
      call: |-
          foo(o, 0, 0, 0) // CTE: No such signature

    - tags: 'compile-only, negative'
      call: |-
          foo(a, 0, 0, 0) // CTE: No such signature

    - tags: 'compile-only, negative'
      call: |-
          foo(b, 0, 0, 0) // CTE: No such signature

    - tags: 'compile-only, negative'
      call: |-
          foo(o, 0, 0, 0, 0) // CTE: No such signature

    - tags: 'compile-only, negative'
      call: |-
          foo(a, 0, 0, 0, 0, 0) // CTE: No such signature

    - tags: 'compile-only, negative'
      call: |-
          foo(b, 0, 0, 0, 0, 0) // CTE: No such signature
