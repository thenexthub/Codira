---
cases:
    - call: |-
          // x.foo(p: FA)
          arktest.assertEQ((x.foo(fa) as FA)("A", 1.0), "A1")
          arktest.assertEQ((x.foo(fb) as FB)("A"), "FBA")
          arktest.assertEQ((x.foo(fc) as FC)(), "FC")
          arktest.assertEQ((x.foo(fd) as FD)("A", 1.0), "FDA1")
          arktest.assertEQ((x.foo(fe) as FE)("x", "y"), "FExy")

          // x.foo(p: FB, x1: int)
          arktest.assertEQ((x.foo(fb, 0) as FB)("A"), "FBA")
          arktest.assertEQ((x.foo(fc, 0) as FC)(), "FC")

          // x.foo(p: FC, x1: int, x2: int)
          arktest.assertEQ((x.foo(fc, 0, 0) as FC)(), "FC")

          // x.foo(p: FD, x1: int, x2: int, x3: int)
          arktest.assertEQ((x.foo(fd, 0, 0, 0) as FD)("A", 1.0), "FDA1")

          // x.foo(p: FE, x1: int, x2: int, x3: int, x4: int)
          arktest.assertEQ((x.foo(fb, 0, 0, 0, 0) as FB)("A"), "FBA")
          arktest.assertEQ((x.foo(fc, 0, 0, 0, 0) as FC)(), "FC")
          arktest.assertEQ((x.foo(fe, 0, 0, 0, 0) as FE)("x", "y"), "FExy")

    - tags: 'compile-only, negative'
      call: |-
          x.foo(fa, 0)

    - tags: 'compile-only, negative'
      call: |-
          x.foo(fa, 0, 0)

    - tags: 'compile-only, negative'
      call: |-
          x.foo(fb, 0, 0)

    - tags: 'compile-only, negative'
      call: |-
          x.foo(fa, 0, 0, 0)

    - tags: 'compile-only, negative'
      call: |-
          x.foo(fb, 0, 0, 0)

    - tags: 'compile-only, negative'
      call: |-
          x.foo(fa, 0, 0, 0, 0)
