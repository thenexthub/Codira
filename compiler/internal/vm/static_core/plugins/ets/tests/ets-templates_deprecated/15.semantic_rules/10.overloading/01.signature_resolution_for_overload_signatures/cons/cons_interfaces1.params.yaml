---
cases:
    - call: |-
          arktest.assertEQ(new X(vo).res, "Object")

          arktest.assertEQ(new X(vi).res, "IObject")
          arktest.assertEQ(new X(vi, 0).res, "IObject")
          arktest.assertEQ(new X(vi, 0, 0, 0).res, "IObject")

          arktest.assertEQ(new X(vj).res, "JIObject") // J <: I
          arktest.assertEQ(new X(vj, 0).res, "JIObject")
          arktest.assertEQ(new X(vj, 0, 0).res, "JIObject")
          arktest.assertEQ(new X(vj, 0, 0, 0).res, "JIObject")

    - tags: 'compile-only, negative'
      call: |-
          new X(vo, 0) // CTE: No such signature

    - tags: 'compile-only, negative'
      call: |-
          new X(vo, 0, 0, 0) // CTE: No such signature

    - tags: 'compile-only, negative'
      call: |-
          new X(vi, 0, 0) // CTE: No such signature
