- {
    method_name: valueOf,
    object_type: Long,
    param_init_data_types: {"param1":"FixedArray<long>"} ,
    param_types: {"param1":long},
    param_nature: {"param1": primitive},
    method_return_type: Long,
    expected_data_item_type: long,
    expected_data_type: "FixedArray<long>",
    param_list: {"param1": "[(-1) as long, 0 as long, 1 as long, Long.MAX_VALUE as long, Long.MIN_VALUE as long]"},
    expected_test_data: "[(-1) as long, 0 as long, 1 as long, Long.MAX_VALUE as long, Long.MIN_VALUE as long]",
    verify_test_result_function: compareWrapperObjectValue,
  }
- {
    method_name: parseInt,
    object_type: Long,
    param_init_data_types: { "param1": "FixedArray<String>", "param2": "FixedArray<Int>" } ,
    param_types: { "param1": String, "param2": "Int" },
    param_nature: { "param1": primitive, "param2": primitive },
    method_return_type: Long,
    expected_data_item_type: Long,
    expected_data_type: "FixedArray<Long>",
    param_list: {
      "param1": '["123", "123", "-123", "+123", "-9223372036854775808", "9223372036854775807", "-0", "+0", "  -123  ", "\t123\n",
        "101010", "-101010", "111111111111111111111111111111111111111111111111111111111111111", "12", "-52", "777777777777777777777",
        "A", "FF", "-2A", "7FFFFFFFFFFFFFFF", "7fffffffffffffff", "0x1A", "0XFF",
        "z", "Z", "1Z", "-A", "  Z1  ",
        "0x1A", "123abc", "42.99", "0xFFG"]',
      "param2": '[0, 10, 10, 10, 10, 10, 10, 10, 10, 10,
        2, 2, 2, 8, 8, 8,
        16, 16, 16, 16, 16, 16, 16,
        36, 36, 36, 36, 36,
        0, 10, 10, 16]',
    },
    expected_test_data: '[123, 123, -123, 123, -9223372036854775808, 9223372036854775807, 0, 0, -123, 123,
      42, -42, 9223372036854775807, 10, -42, 9223372036854775807,
      10, 255, -42, 9223372036854775807, 9223372036854775807, 26, 255,
      35, 35, 71, -10, 1261,
      0, 123, 42, 255]',
    verify_test_result_function: compareWrapperObjectValue,
  }
