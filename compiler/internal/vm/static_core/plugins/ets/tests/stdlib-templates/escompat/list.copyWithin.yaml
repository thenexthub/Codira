}
- {
  name: "copyWithinNegativeRelativeOffsets2",
  expected: [4, 2, 3, 4, 5],
  params: [0, -2, -1]
}
- {
  name: "copyWithinNegativeRelativeOffsets3",
  expected: [1, 3, 3, 4, 5],
  params: [-4, -3, -2]
}
- {
  name: "copyWithinNegativeRelativeOffsets4",
  expected: [1, 3, 4, 4, 5],
  params: [-4, -3, -1]
}
- {
  name: "copyWithinNegativeRelativeOffsets5",
  expected: [1, 3, 4, 5, 5],
  params: [-4, -3]
