- {
    method_name: sign,
    method_nature: function,
    result_type: int,
    method_signature:  {v: "double"},

    method_test_index_data:
      {
        test1: { v: 0.0, },
        test2: { v: PI,},
        test3: { v: -PI },
        test4: { v: -0.0 }
      },
    method_expected_data:
      {
        test1:  0.0,
        test2:  1.0,
        test3: -1.0,
        test4:  0.0
      },
  }
- {
    method_name: signbit,
    method_nature: function,
    result_type: boolean,
    method_signature:  {v: "double"},

    method_test_index_data:
      {
        test1: { v: 0.0, },
        test2: { v: PI,},
        test3: { v: -PI },
        test4: { v: -0.0 }
      },
    method_expected_data:
      {
        test1:  "false",
        test2:  "false",
        test3:  "true",
        test4:  "true"
      },
  }
- {
    method_name: clz32,
    method_nature: function,
    result_type: int,
    method_signature:  {v: "int"},

    method_test_index_data:
      {
        test1: { v: 0xFFFFFFFF.toInt()},
        test2: { v: 0x0FFFFFFF.toInt()},
        test3: { v: 0x00FFFFFF.toInt()},
        test4: { v: 0x000FFFFF.toInt()},
        test5: { v: 0x0000FFFF.toInt()},
        test6: { v: 0x00000FFF.toInt()},
        test7: { v: 0x000000FF.toInt()},
        test8: { v: 0x0000000F.toInt()},
        test9: { v: 0x00000000.toInt()},
      },
    method_expected_data:
      {
        test1:  0,
        test2:  4,
        test3:  8,
        test4:  12,
        test5:  16,
        test6:  20,
        test7:  24,
        test8:  28,
        test9:  32,
      }
  }
