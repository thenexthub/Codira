category: ArrayLambdas
sub:
  - self:
      - Array.of<number>(-2, -1, 0, 1, 2)
      - Array.of<number>(2, -2, 1, -1, 0)
      - Array.of<number>(NaN, Infinity, -Infinity, NaN)
    self_type: Array<number>
    vars:
      bool_lambdas:
        - |
          (): boolean => true
        - |
          (): boolean => false
        - |
          (x: number): boolean => true
        - |
          (x: number): boolean => false
        - |
          (x: number): boolean => isNaN(x)
        - |
          (x: number): boolean => x > 0
        - |
          (x: number): boolean => x < 0
        - |
          (x: number): boolean => x == 1
        - |
          (x: number): boolean => x % 2 == 0
        - |
          (x: number): boolean => Math.abs(x) == 1
        - |
          (x: number, i, s: Array<number>): boolean => (x + i) > 0
        - |
          (x: number, i, s: Array<number>): boolean => (x + i) % 2 == 0
        - |
          (x: number, i, s: Array<number>): boolean => i % 2 == 0
        - |
          (x: number, i, s: Array<number>): boolean => (x + i) < 0
        - |
          (x: number, i, s: Array<number>): boolean => (x + i) == 1
      number_lambdas:
        - |
          (): number => 1234.0
        - |
          (x: number): number => x * 2.0
        - |
          (x: number, i): number => x + i
        - |
          (x: number, i, s: Array<number>): number => x + i
    sub:
      - method: filter
        params:
          - paramOf *bool_lambdas
      - method: every
        params:
          - paramOf *bool_lambdas
      - method: some
        params:
          - paramOf *bool_lambdas
      - method: find
        params:
          - paramOf *bool_lambdas
      - method: findIndex
        params:
          - paramOf *bool_lambdas
      - method: findLast
        params:
          - paramOf *bool_lambdas
      - method: findLastIndex
        params:
          - paramOf *bool_lambdas
      - method: forEach
        ret_type: void
        params:
          -
            - |
              (value: number, index, array: Array<number>): void => {
                if (array.length < 15) {
                  array.push(-value)
                }
              }
            - |
              (value: number, index): void => { value = value + index }
            - |
              (value: number): void => { value = value + value }
            - |
              (): void => {}
      - method: map<number>
        ret_type: Array<number>
        params:
          - paramOf *number_lambdas
