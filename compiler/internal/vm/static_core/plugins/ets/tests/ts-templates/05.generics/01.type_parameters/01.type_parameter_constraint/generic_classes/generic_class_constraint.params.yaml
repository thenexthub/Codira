--- # Type constranumbers for generic parameters
constaints:
  - type: number
    use: number
  - type: number | number
    use: number
  - type: number | number
    use: number
  - type: boolean
    use: boolean
  - type: string
    use: string
  - type: '"a" | "b"'
    use: '"a"'

# Top level class modifiers
top_level_class_modifiers:
  - ""
  - abstract
  - final
