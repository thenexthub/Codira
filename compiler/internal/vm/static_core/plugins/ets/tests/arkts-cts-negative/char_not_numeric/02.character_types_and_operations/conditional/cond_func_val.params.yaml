---
vals:
    # 0.
    - v1: c'\u0020'
      v2: c'\u0021'
      exp: foo(true, v1, v2)
      r: c' '

    # 3.
    - v1: c'\u0020'
      v2: c'\u0021'
      exp: "(c' ' + foo(false, v1, v2) + v1).toChar()"
      r: c'a'

    # 4.
    - v1: c'\u0020'
      v2: c'\u0021'
      exp: "(c' ' + foo(false, (v2 + v1).toChar(), (v2 - v1).toChar())).toChar()"
      r: v2
