--- # List of valid function declarations
function_decls:
    # no params, void return type
    - decl: |-
        function foo(): void {}
      call: |-
        foo();

    - decl: |-
        function foo() {}
      call: |-
        foo();

    # no params, return value type
    - decl: |-
        function foo(): int { return 0; }
      call: |-
        let i = foo();
        arktest.assertEQ( i, 0 )

    # no params, return value type array
    - decl: |-
        function foo(): int[] { return new int[1]; }
      call: |-
        let arr: int[] = foo();
        arktest.assertTrue( arr instanceof int[] && arr.length == 1 )

    # no params, return function
    - decl: |-
        function bar() {}
        function foo(): () => void {
            return bar;
        }
      call: |-
        let f: () => void = foo();
        arktest.assertTrue( f instanceof (() => void) )

    # no params, return reference type
    - decl: |-
        function foo(): Long { return new Long(); }
      call: |-
        let f: Long = foo();
        arktest.assertTrue( f instanceof Long )

    - decl: |-
        function foo(): Object|null { return null; }
      call: |-
        let f: Object|null = foo();
        arktest.assertEQ( f, null )

    # no params, return reference type array
    - decl: |-
        function foo(): Long[] { return new Long[0]; }
      call: |-
        let f: Long[] = foo();
        arktest.assertTrue( f instanceof Long[] && f.length == 0 )

    - decl: |-
        function foo(): (Object|undefined)[] {
            let arr: (Object|undefined)[] = new (Object|undefined)[0]
            return arr;
        }
      call: |-
        let f: (Object|undefined)[] = foo();
        arktest.assertTrue( f instanceof (Object|undefined)[] && f.length == 0)

    # no params, return enum
    - decl: |-
        enum Color { Red, Green, Blue }
        function foo(): Color { return Color.Red; }
      call: |-
        let e: Color  = foo();
        arktest.assertEQ( e, Color.Red )
