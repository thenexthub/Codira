--- # List of types
types:
    - decl: |-
          type NT = string | number | never
      use: |-
          let x: NT = 42.0
          arktest.assertTrue( x as number == 42.0)
          x = "abc"
          arktest.assertTrue( x as string == "abc")

    - use: |-
          let x: (number|never)[] = [1.0, 2.0, 3.0]
          arktest.assertTrue( x[2] as number == 3.0)

    - use: |-
          let x: (string|never)[] = ['1', '2', '3']
          arktest.assertTrue( x[2] as string == '3')

    - decl: |-
          class A<T> {}
      use: |-
          let x: A<never> = new A<never>()
          arktest.assertTrue( x instanceof Object)

    - use: |-
          let x: Record<string, never|null> = { "abc": null }

    - use: |-
          let x: (never|null|undefined) = null
          arktest.assertTrue( x === null)
          x = undefined
          arktest.assertTrue( x === undefined)

    - use: |-
          let x: never[] = [] as never[]
