---
cases:
  - variance: "in "
    use: |-
        let i: I<X> = new A<Object>(new X())
        i.methIn(new X())
  - variance: "in "
    use: |-
        let i: I<Y> = new A<X>(new X())
        let z: X = i.methOut()
  - variance: "in "
    use: |-
        let i: I<Y> = new A<X>(new X())
        let z: X = i.methInOut(new X())

  - variance: "out "
    use: |-
        let i: I<Object> = new A<X>(new X())
        let z: X = i.methOut()
  - variance: "out "
    use: |-
        let i: I<X> = new A<Y>(new Y())
        i.methIn(new Y())
  - variance: "out "
    use: |-
        let i: I<X> = new A<X>(new X())
        let z: X = i.methInOut(new X())
