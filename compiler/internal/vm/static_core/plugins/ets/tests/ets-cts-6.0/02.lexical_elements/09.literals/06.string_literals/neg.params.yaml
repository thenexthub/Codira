cases:
  # missing quotes
  - "\"abc"
  - "abc\""
  - "'abc"
  - "abc'"
  - "\"abc'"
  - "'abc\""

  # invalid escape sequences
  - "\"\\u0a9k\""
  - "\"\\x1G\""
  - "\"\\x2\""
  - "\"\\u{110000}\""
  - "\"\\u{10FFFF\""
  - "\"\\uFFFG\""
  - "\"\\x-23\""
  - "\"\\u-2345\""
  - "\"\\u{-1234}\""
  - "\"\\u{}\""
