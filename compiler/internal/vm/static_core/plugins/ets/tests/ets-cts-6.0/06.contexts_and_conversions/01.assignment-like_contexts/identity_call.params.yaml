---
cases:
  - types:
      - { type: boolean, expr: 'false' }
      - { type: byte, expr: '127 as byte' }
      - { type: short, expr: '(32_767).toShort()' }
      - { type: int, expr: 2_147_483_647 }
      - { type: long, expr: '(9_223_372_036_854_775_807).toLong()' }
      - { type: float, expr: '3.40282346e38f' }
      - { type: double, expr: 1.7976931348623157e308 }
      - { type: char, expr: "c'A'" }
      - { type: 'Boolean|null', expr: new Boolean(false) }
      - { type: 'Byte|null', expr: new Byte(new Int(1).toByte()) }
      - { type: 'Char|null', expr: new Char(c'A') }
      - { type: 'Error|null', expr: new Error("msg") }
      - { type: 'Barfunc|null', expr: bar }
      - { type: 'Barfunc[]|null', expr: '[bar]' }
