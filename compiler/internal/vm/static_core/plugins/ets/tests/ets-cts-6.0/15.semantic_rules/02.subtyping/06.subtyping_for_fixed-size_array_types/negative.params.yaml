---
cases:
    - dtype: |-
          Number
      value: |-
          [1,2,3]
      stype: |-
          Object
    - dtype: |-
          boolean
      value: |-
          [true, false, true]
      stype: |-
          Object
    - dtype: |-
          null
      value: |-
          [null, null, null]
      stype: |-
          Any
    - dtype: |-
          undefined
      value: |-
          [undefined, undefined, undefined]
      stype: |-
          Any
    - dtype: |-
          Derived
      value: |-
          [new Derived, new Derived]
      stype: |-
          Base
    - dtype: |-
          String
      value: |-
          ['1','2','3']
      stype: |-
          Object
    - dtype: |-
          'a'
      value: |-
          ['a','a','a']
      stype: |-
          Object	
    - dtype: |-
          Base|Derived
      value: |-
          [new Base(), new Derived()]
      stype: |-
          Object
    - dtype: |-
          String | Number
      value: |-
          ['1', 1, 2]
      stype: |-
          Object		  
    - dtype: |-
          Derived
      value: |-
          [new Derived(), new Derived()]
      stype: |-
          Base
      customtype: |-
          yes
