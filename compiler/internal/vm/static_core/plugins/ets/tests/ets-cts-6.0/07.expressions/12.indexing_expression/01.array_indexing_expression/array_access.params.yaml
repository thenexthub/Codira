---
cases:
  - { type: int,   x: 1,              index: 0,        value: 1 }
  - { type: int,   x: 1,              index: 'x',      value: 2 }
  - { type: int,   x: 1,              index: 'x + 1',  value: 3 }
  - { type: int,   x: 1,              index: 'arr[0]', value: 2 }
  - { type: int,   x: 1,              index: 'arr[x]', value: 3 }
  - { type: Byte,  x: 'new Byte(2)',  index: x,        value: 3 }
  - { type: byte,  x: 'new Byte(0)',  index: x,        value: 1 }
  - { type: Short, x: 'new Short(0)', index: x,        value: 1 }
  - { type: short, x: 'new Short(1)', index: x,        value: 2 }
  - { type: Int,   x: 'new Int(1)',   index: x,        value: 2 }
  - { type: int,   x: 'new Int(2)',   index: x,        value: 3 }
    