---
cases:
  - decl: |-
      abstract class AC {
        i?: number = 0
        foo() {}
      }
    check: |-
      let a: Partial<AC> = { i: 1.1 }
      a.foo()
    tags: compile-only,negative

  - decl: |-
      class C {
        i?: number = 0
        foo() {}
      }
    check: |-
      let a: Partial<C> = { i: 1.1 }
      a.foo()
    tags: compile-only,negative

  - decl: |-
      interface I {
        i?: number
        foo() {}
      }
    check: |-
      let a: Partial<I> = { i: 1.1 }
      a.foo()
    tags: compile-only,negative

  - decl: |-
      interface I {
        i?: number
        foo()
      }
      class A implements I {
        i?: number = 0
        foo() {}
        bar() {}
      }
    check: |-
      let a: Partial<A> = { i: 1.1 }
      a.foo()
    tags: compile-only,negative

  - decl: |-
      interface I {
        i?: number
        foo()
      }
      class C implements I {
        i?: number = 0
        foo() {}
        bar() {}
      }
    check: |-
      let a: Partial<C> = { i: 1.1 }
      a.bar()
    tags: compile-only,negative

  - decl: |-
      abstract class AC {
        i?: number = 0
        foo() {}
      }
      class C extends AC {
        j?: string = "str"
        bar() {}
      }
    check: |-
      let a: Partial<C> = { i: 1.1, j: "str2" }
      a.bar()
    tags: compile-only,negative

  - decl: |-
      abstract class AC {
        i?: number = 0
        foo() {}
      }
      class C extends AC {
        j?: string = "str"
        bar() {}
      }
    check: |-
      let a: Partial<C> = { i: 1.1, j: "str2" }
      a.foo()
    tags: compile-only,negative

  - decl: |-
      class A {
        i?: number = 0
        foo() {}
      }
      class B extends A {
        j?: string = "str"
        bar() {}
      }
    check: |-
      let a: Partial<B> = { i: 1.1, j: "str2" }
      a.foo()
    tags: compile-only,negative

  - decl: |-
      class A {
        i?: number = 0
        foo() {}
      }
      class B extends A {
        j?: string = "str"
        bar() {}
      }
    check: |-
      let a: Partial<B> = { i: 1.1, j: "str2" }
      a.bar()
    tags: compile-only,negative

  - decl: |-
      class C {
        _i: number|undefined
        set i(i: number|undefined) { this._i = 1; }
        get i(): number|undefined { return this._i; }
      }
    check: |-
      let a: Partial<C> = {i: 1.9}
      arktest.assertEQ( a.i , 1.9 )
      a.i = 2.1
      arktest.assertEQ( a.i , 2.1 )

  - decl: |-
      abstract class C {
        _i: number|undefined
        set i(i: number|undefined) { this._i = 1; }
        get i(): number|undefined { return this._i; }
      }
    check: |-
      let a: Partial<C> = {i: 1.9}
      arktest.assertEQ( a.i , 1.9 )
      a.i = 2.1
      arktest.assertEQ( a.i , 2.1 )
