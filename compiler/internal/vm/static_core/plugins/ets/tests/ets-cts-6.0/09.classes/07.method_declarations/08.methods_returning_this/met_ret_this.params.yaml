---
cases:
    - decl: |-
          // return 'this' from instance method
          class A {
              fld: int
              foo(): this {
                  if (this.fld == 0) {
                      return this
                  }
                  throw new Error
              }
          }
      use: |-
          let a = new A
          arktest.assertEQ(a.foo().foo(), a)

    - decl: |-
          // return 'this' from extension function and overloaded method
          class B {
              fld: int
          }

          function foo(this: B, p: int): this {
              this.fld += p
              return this
          }
          class A extends B {
              foo(): this {
                  this.fld += 1
                  return this
              }
          }
      use: |-
          let a: A = { fld: 1 }
          arktest.assertEQ(a.foo().foo(10).foo(), a)
          arktest.assertEQ(a.fld, 13)

    - decl: |-
          // return 'this' from instance method in generic class
          class A<T extends Error> {
              fld: int
              foo(p: T): this {
                  if (this.fld == 0) {
                      return this
                  }
                  throw p as Error
              }
          }
      use: |-
          let a = new A<Error>
          arktest.assertEQ(a.foo(new Error).foo(new Error), a)

    - decl: |-
          // return 'this' from generic method
          class A {
              fld: number
              foo<T extends Error>(p: T): this {
                  if (this.fld == 0) {
                      return this
                  }
                  throw p as Error
              }
              bar<T extends Number>(p: T): this {
                  if (this.fld == 0) {
                      this.fld += p.valueOf()
                      return this
                  }
                  throw new Error
              }
          }

          class Er extends Error {}
      use: |-
          let a = new A
          arktest.assertEQ(a.foo<Er>(new Er).bar<Number>(11.0), a)
          arktest.assertEQ(a.fld, 11.0)

    - decl: |-
          // return 'this' from function with receiver
          function foo(this: A): this {
              if (this.fld == 0) {
                  return this
              }
              throw new Error
          }

          class A {
              fld: int
          }
      use: |-
          let a = new A
          arktest.assertEQ(a.foo().foo(), a)

    - decl: |-
          // return 'this' from final method
          class A {
              fld: int
              final foo(): this {
                  if (this.fld == 0) {
                      return this
                  }
                  throw new Error
              }
          }
      use: |-
          let a = new A
          arktest.assertEQ(a.foo().foo(), a)

    - decl: |-
          // return 'this' from superclass
          abstract class Super {
              fld: number = 0
              foo(): this {
                  if (this.fld == 0) {
                      return this
                  }
                  throw new Error
              }
          }

          class A extends Super {}
      use: |-
          let s: Super = new A
          arktest.assertEQ(s.foo().foo(), s)
          let a: A = new A
          arktest.assertEQ(a.foo().foo(), a)

    - decl: |-
          // return 'this' from superclass
          abstract class Super {
              fld: number = 0
              foo(): this {
                  if (this.fld == 0) {
                      return this
                  }
                  throw new Error
              }
          }

          class A extends Super {}

          let s: Super = new A
          let a: A = new A
      use: |-
          arktest.assertEQ(s.foo().foo(), s)
          arktest.assertEQ(a.foo().foo(), a)

    - decl: |-
          // return 'this' from superclass with field overridden
          abstract class Super {
              fld: number = 0
              foo(): this {
                  return this
              }
          }

          class A extends Super {
              fld: number = 1
          }

          let s: Super = new A
          let a: A = new A
      use: |-
          arktest.assertEQ(s.foo().fld, 1)
          arktest.assertEQ(a.foo().fld, 1)

    - decl: |-
          // return 'this' from superclass with method overridden
          abstract class Super {
              fld: string = ""
              foo(): this {
                  if (this.fld == "") {
                      return this
                  }
                  throw new Error
              }
              bar(): string {
                  return this.fld + "Super"
              }
          }

          class A extends Super {
              bar(): string {
                  return this.fld + "A"
              }
          }

          let s: Super = new A
          let a: A = new A
      use: |-
          arktest.assertEQ(s.foo().bar(), "A")
          arktest.assertEQ(a.foo().bar(), "A")

    - decl: |-
          // return 'this' from superclass from function with receiver
          function foo(this: Super): this {
              if (this.fld == 0) {
                  return this
              }
              throw new Error
          }

          abstract class Super {
              fld: int
          }

          class A extends Super {}

          let s: Super = new A
          let a: A = new A
      use: |-
          arktest.assertEQ(s.foo().foo(), s)
          arktest.assertEQ(a.foo().foo(), a)

    - decl: |-
          // return 'this' from superclass with overriding
          abstract class Super {
              fld: int
              foo(): this {
                  if (this.fld == 999) {
                      return this
                  }
                  throw new Error
              }
          }

          class A extends Super {
              foo(): this {
                  if (this.fld == 0) {
                      return this
                  }
                  throw new Error
              }
          }

          let s: Super = new A
          let a: A = new A
      use: |-
          arktest.assertEQ(s.foo().foo(), s)
          arktest.assertEQ(a.foo().foo(), a)

    - decl: |-
          // return 'this' from superclass with overriding abstract method
          abstract class Super {
              fld: int
              abstract foo(): this
          }

          class A extends Super {
              foo(): this {
                  if (this.fld == 0) {
                      return this
                  }
                  throw new Error
              }
          }

          let s: Super = new A
          let a: A = new A
      use: |-
          arktest.assertEQ(s.foo().foo(), s)
          arktest.assertEQ(a.foo().foo(), a)

    - decl: |-
          // return 'this' from superclass with different methods
          abstract class Super {
              fld: int
              foo(): this {
                  if (this.fld == 0) {
                      return this
                  }
                  throw new Error
              }
          }

          class A extends Super {
              bar(): this {
                  if (this.fld == 0) {
                      return this
                  }
                  throw new Error
              }
          }

      use: |-
          let s: Super = new A
          let a: A = new A
          arktest.assertEQ(s.foo().bar().foo().bar(), s)
          arktest.assertEQ(a.foo().bar().foo().bar(), a)

    - decl: |-
          // return 'this' from superclass with different functions with receiver
          abstract class Super {
              fld: int
          }

          function foo(this: Super): this {
              if (this.fld == 0) {
                  return this
              }
              throw new Error
          }

          class A extends Super {}

          function bar(this: A): this {
              if (this.fld == 0) {
                  return this
              }
              throw new Error
          }

          let a: A = new A
          let s: Super = new A
      use: |-
          arktest.assertEQ((s.foo() as A).bar(), s)
          arktest.assertEQ(a.bar().foo(), a)

    - decl: |-
          // return 'this' from interface
          interface I {
              foo(): this
          }

          class A implements I {
              fld: int
              foo(): this {
                  if (this.fld == 0) {
                      return this
                  }
                  throw new Error
              }
          }

          let i: I = new A
      use: |-
          arktest.assertEQ(i.foo().foo(), i)

    - decl: |-
          // return 'this' from default interface method
          interface I {
              fld: int
              foo(): this {
                  if (this.fld == 0) {
                      return this
                  }
                  throw new Error
              }
          }

          class A implements I {
              fld: int
          }

          let i: I = new A
      use: |-
          arktest.assertEQ(i.foo().foo(), i)

    - decl: |-
          // call method returning 'this' from constructor
          class A {
              fld: int
              constructor() {
                  this.foo().fld = 1
              }
              private foo(): this {
                  if (this.fld == 0) {
                      return this
                  }
                  throw new Error
              }
          }

          let a = new A
      use: |-
          arktest.assertEQ(a.fld, 1)

    - decl: |-
          // call function returning 'this' from constructor
          class A {
              fld: int
              constructor() {
                  this.foo().fld = 1
              }
          }

          function foo(this: A): this {
              if (this.fld == 0) {
                  return this
              }
              throw new Error
          }

          let a = new A
      use: |-
          arktest.assertEQ(a.fld, 1)

    - decl: |-
          // calling method returning 'this' from throw statement
          class A extends Error {
              fld: int
              constructor(p: string) {
                  super(p)
              }
              foo(p: int): this {
                  if (p == 0) {
                      throw new A('Error in A')
                  }
                  this.fld += p
                  return this
              }
          }
      use: |-
          let a = new A('Error in main')
          try {
              if (a.foo(1) == a) {
                  throw a.foo(1).foo(2).foo(3)
              }
          } catch (e) {
            if (e instanceof A) {
              arktest.assertEQ(e.message, 'Error in main')
              return
            }
          }
          arktest.assertTrue(false, 'Expected error not thrown')

    - decl: |-
          // calling extension function returning 'this' from throw statement
          class A extends Error {
              fld: int
              constructor(p: string) {
                  super(p)
              }
          }

          function foo(this: A, p: int): this {
              if (p == 0) {
                  throw new A('Error in A')
              }
              this.fld += p
              return this
          }
      use: |-
          let a = new A('Error in main')
          try {
              if (a.foo(1) == a) {
                  throw a.foo(1).foo(2).foo(3)
              }
          } catch (e) {
              if (e instanceof A) {
                arktest.assertEQ(e.message, 'Error in main')
                arktest.assertEQ(e.fld, 7)
                return
              }
          }
          arktest.assertTrue(false, 'Expected error not thrown')

    - decl: |-
          // calling method returning 'this' from throw statement
          class A extends Error {
              fld: int
              constructor(p: string) {
                  super(p)
              }
              foo(p: int): this {
                  if (p == 0) {
                      throw new A('Error in A')
                  }
                  this.fld += p
                  return this
              }
          }
      use: |-
          let a = new A('Error in main')
          try {
              if (a.fld == 0) {
                  throw a.foo(0).foo(1).foo(2)
              }
          } catch (e) {
              if (e instanceof A) {
                arktest.assertEQ(e.message, 'Error in A')
                arktest.assertEQ(e.fld, 0)
                return
              }
          }
          arktest.assertTrue(false, 'Expected error not thrown')

    - decl: |-
          // calling extension function returning 'this' from throw statement
          class A extends Error {
              fld: int
              constructor(p: string) {
                  super(p)
              }
          }

          function foo(this: A, p: int): this {
              if (p == 0) {
                  throw new A('Error in A')
              }
              this.fld += p
              return this
          }
      use: |-
          let a = new A('Error in main')
          try {
              if (a.fld == 0) {
                  throw a.foo(0).foo(1).foo(2)
              }
          } catch (e) {
              if (e instanceof A) {
                arktest.assertEQ(e.message, 'Error in A')
                arktest.assertEQ(e.fld, 0)
                return
              }
          }
          arktest.assertTrue(false, 'Expected error not thrown')

    - decl: |-
          // calling method returning 'this' from coroutine
          import { launch } from "std/concurrency"
          import { Job } from "std/concurrency"
          class A {
              fld: int
              foo(): this {
                  if (this.fld == 999) {
                      throw new Error
                  }
                  this.fld += 1
                  return this
              }

              bar(): Job<this> {
                  return launch<A, () => A>(this.foo().foo().foo)
              }
          }
      use: |-
          let a = new A
          arktest.assertEQ((a.bar().Await()), a)
          arktest.assertEQ(a.fld, 3)

    - decl: |-
          // calling extension function returning 'this' from coroutine
          class A {
              fld: int
              bar(): Promise<this> {
                  return Promise.resolve(this.foo().foo().foo())
              }
          }

          function foo(this: A): this {
              if (this.fld == 999) {
                  throw new Error
              }
              this.fld += 1
              return this
          }
      use: |-
          let a = new A
          arktest.assertEQ((await a.bar()), a)
          arktest.assertEQ(a.fld, 3)

    - decl: |-
          // calling async method returning 'this'
          class A {
              fld: int
              async foo(): Promise<this> {
                  if (this.fld == 999) {
                      throw new Error
                  }
                  this.fld += 1
                  return this
              }
          }
      use: |-
          let a = new A
          arktest.assertEQ((await (await a.foo()).foo()), a)
          arktest.assertEQ(a.fld, 2)

    - decl: |-
        class A {
            fld: int
            foo(): this {
                if (this.fld == 0) {
                    return this.bar()
                }
                throw new Error
            }
            bar(): this {
                if (this.fld == 0) {
                    return this
                }
                throw new Error
            }
        }
      use: |-
        let x = new A().foo()

    - decl: |-
        class A {
            fld: int
            foo(): this {
                return this.fld == 0 ? this : this.bar()
            }
            bar(): this {
                if (this.fld == 0) {
                    return this
                }
                throw new Error
            }
        }
      use: |-
        let x = new A().foo()

    - decl: |-
        abstract class Super {
            fld: int
            foo(): this {
                if (this.fld == 0) {
                    return this
                }
                throw new Error
            }
        }
        class A extends Super {
            foo(): this {
                if (this.fld == 999) {
                    return this
                }
                return super.foo()
            }
        }
      use: |-
        let x = new A().foo()
