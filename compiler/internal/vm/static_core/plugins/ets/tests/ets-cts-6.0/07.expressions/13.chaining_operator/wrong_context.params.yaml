  # complicated class field and array
    - decl: |-
        class A {
            b: B = new B();
        }

        class B {
            c: C = new C();
        }

        class C {
          value: int|null = 1;
        }
      use: |-
        const a1 = new A();
        a1.b.c?.value = 1

    - decl: |-
        let counts: int[][] = [[1, 2], [3. 4]];
      use: |-
        counts?.[0][0] = 0;
