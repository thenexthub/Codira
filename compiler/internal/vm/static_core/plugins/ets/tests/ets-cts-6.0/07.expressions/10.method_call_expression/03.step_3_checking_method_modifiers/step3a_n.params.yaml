---
cases:
    - decl: |-
          class A {
              met(): string {
                  return "S"
              }
          }
      use: |-
          arktest.assertEQ( A.met(), "S" )

    - decl: |-
            interface I {
                met(): string {
                    return "I"
                }
            }
      use: |-
          arktest.assertEQ( I.met(), "I" )

    - decl: |-
          class A {
              met(): string {
                  return "S"
              }
          }
          type TA = A
      use: |-
          // class name alias
          arktest.assertEQ( TA.met(), "S" )

    - decl: |-
          interface I {
              met(): string {
                  return "I"
              }
          }
          type TI = I
      use: |-
          // interface name alias
          arktest.assertEQ( TI.met(), "I" )

    - decl: |-
          class A {
              static met(): string {
                  return "SA"
              }
          }
          class B {
              static met(): string {
                  return "SB"
              }
          }
          type UT = A | B
      use: |-
          // class name
          arktest.assertEQ( UT.met(), "S" )

    - decl: |-
          interface I {
              static met(): string {
                  return "I"
              }
          }
          interface J {
              static met(): string {
                  return "J"
              }
          }
          type UT = I | J
      use: |-
          // interface name
          arktest.assertEQ( UT.met(), "I" )
