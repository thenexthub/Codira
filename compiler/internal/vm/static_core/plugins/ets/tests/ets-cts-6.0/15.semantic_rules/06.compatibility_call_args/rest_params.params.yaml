---
cases:
    - to_type: short[]
      value: |-
        0b0.toByte(), Byte.MIN_VALUE, Byte.MAX_VALUE
      result: 
        - 0
        - -128
        - 127

    - to_type: int[]
      value: |-
        0b0.toByte(), Byte.MIN_VALUE, Byte.MAX_VALUE
      result: 
        - 0
        - -128
        - 127

    - to_type: long[]
      value: |-
        0b0.toByte(), Byte.MIN_VALUE, Byte.MAX_VALUE
      result: 
        - new Long(0)
        - new Long(-128)
        - new Long(127)

    - to_type: float[]
      value: |-
        0b0.toByte(), Byte.MIN_VALUE, Byte.MAX_VALUE
      result: 
        - new Float(0)
        - new Float(-128)
        - new Float(127)

    - to_type: int[]
      value: |-
        0b0.toShort(), Short.MIN_VALUE, Short.MAX_VALUE
      result: 
        - 0
        - -32_768
        - 32_767

    - to_type: number[]
      value: |-
        0b0.toShort(), Short.MIN_VALUE, Short.MAX_VALUE
      result: 
        - 0.0
        - -32_768 as number
        - 32_767 as number

    - defs: |-
         class B {}
         class C extends B {}
      to_type: |-
         B[]
      value: |-
        new C, new C, new C

    - defs: |-
         interface B {}
         class C implements B {}
      to_type: |-
         B[]
      value: |-
        new C, new C, new C
