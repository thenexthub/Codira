--- # Method modifiers for implemented methods
method_modifiers:
  - static
  - ""

# Type constraints for generic parameters
constraints:
  - type: number
    use: byte
  - type: short
    use: long
  - type: int
    use: long
  - type: byte
    use: char
  - type: char
    use: byte
  - type: string
    use: char
  - type: char
    use: string
