---
cases:
    - decl: |-
        class Cls {
            // no constraints
            foo<T, U>(p: T, q: U): [T, U] {
                return [p, q]
            }
        }
      use: |-
        let cls = new Cls()
        let z = cls.foo<number, boolean>(1.0, true)
        arktest.assertTrue(z instanceof object && z[0] instanceof number && z[1] instanceof boolean)
        arktest.assertTrue(z[0] == 1.0 && z[1])

        let y = cls.foo<Error, string>(new Error(), "abc")
        arktest.assertTrue(y instanceof object && y[0] instanceof object && y[1] instanceof string)
        arktest.assertTrue(y[0] instanceof Error && y[1] == "abc")

        let x = cls.foo<[Number, Boolean], [Error, string]>(z, y)
        arktest.assertTrue(x[0][0] == 1.0 && x[0][1] && x[1][0] instanceof Error && x[1][1] == "abc")

        let w = cls.foo<null, undefined>(null, undefined)
        arktest.assertTrue(w[0] === null && w[1] === undefined)
    - decl: |-
        class Cls {
            // no constraints, union
            foo<T, U>(p: T, q: U): T|U {
                return (p! as object).toString() > (q! as object).toString() ? p : q
            }
        }
      use: |-
        let cls = new Cls()

        let v = cls.foo<number, number>(1.0, 11.0)
        arktest.assertTrue(v as number == 11.0)

        let w = cls.foo<[string, string, string, string], [number, number]>(["a", "b", "c", "d"], [1, 2])
    - decl: |-
        class Bar {
            static bar<T>(p: T): Array<T> {
                let x = Array<T>(5)
                return x.fill(p)
            }
        }

        class Foo {
            // no constraints
            foo<T, U>(p: T, q: U): [Array<T>, Array<U>] {
                return [Bar.bar(p), Bar.bar(q)]
            }
        }
      use: |-
        let err = new Error()
        let z = new Foo().foo<float, Error>(42.0f, err)
        arktest.assertTrue(z[0][0] == 42.0f && z[0][4] == 42.0f && z[1][0] == err && z[1][4] == err)
    - decl: |-
        class A {}
        class B extends A {}

        class Cls {
            // with class type constraints
            foo<T extends U, U extends Object>(p: T, q: U): boolean {
                return p.toString() + q.toString() > ""
            }
        }
      use: |-
        let cls = new Cls()
        arktest.assertTrue(cls.foo<Object, Object>(new Object(), new Object()))
        arktest.assertTrue(cls.foo<A, Object>(new A(), new Object()))
        arktest.assertTrue(cls.foo<B, Object>(new B(), new Object()))
        arktest.assertTrue(cls.foo<A, A>(new A(), new A()))
        arktest.assertTrue(cls.foo<B, A>(new B(), new A()))
        arktest.assertTrue(cls.foo<B, B>(new B(), new B()))
    - decl: |-
        class A {}
        class B extends A {}
        class C extends A {}
        class Cls {
            // with union type constraints
            foo<T extends B|C, U extends number|never|B|null|boolean>(p: T, q: U): boolean {
                return "" + p + q > ""
            }
        }
      use: |-
        let cls = new Cls
        arktest.assertTrue(cls.foo<C, boolean>(new C(), true))
        arktest.assertTrue(cls.foo<B, B>(new B(), new B()))
        arktest.assertTrue(cls.foo<C, double>(new C(), 42.0))
        arktest.assertTrue(cls.foo<B, null>(new B(), null))
  # specific cases: tuple types, FixedArray, Any, union types, bigint, literal types, function types,
  # undefined, null, Array<T> or T[], FixedArray<T>
    - decl: |-
        class Cls {
            foo<T>(p: T): T {
                return p
            }
        }
      use: |-
        let z = new Cls().foo<[number, string]>([1, "abc"])
        arktest.assertTrue(z[0] instanceof number)
        arktest.assertTrue(z[1] instanceof string)
    - decl: |-
        class Cls {
            foo<T>(p: T): T {
                return p
            }
        }
      use: |-
        let z = new Cls().foo<FixedArray<number>>([1])
        arktest.assertTrue(z[0] instanceof number)
    - decl: |-
        class Cls {
            foo<T>(p: T): T {
                return p
            }
        }
      use: |-
        let z = new Cls().foo<Any>(null)
        arktest.assertTrue(z instanceof Any)
    - decl: |-
        class Cls {
            foo<T>(p: T): T {
                return p
            }
        }
      use: |-
        let z = new Cls().foo<bigint>(123n)
        arktest.assertTrue(z instanceof bigint)
    - decl: |-
        class Cls {
            foo<T>(p: T): T {
                return p
            }
        }
      use: |-
        let z = new Cls().foo<"aa" | "bb">("aa")
        arktest.assertTrue(z instanceof string)
    - decl: |-
        function foo1(): number { return 1 }
        class Cls {
            foo<T>(p: T): T {
                return p
            }
        }
      use: |-
        let z = new Cls().foo<() => number>(foo1)
        arktest.assertTrue(z() instanceof number)
    - decl: |-
        class Cls {
            foo<T>(p: T): T {
                return p
            }
        }
      use: |-
        let z = new Cls().foo<undefined>(undefined)
        arktest.assertTrue(z instanceof undefined)
    - decl: |-
        class Cls {
            foo<T>(p: T): T {
                return p
            }
        }
      use: |-
        let z = new Cls().foo<Array<number>>([1])
        arktest.assertTrue(z[0] instanceof number)
    - decl: |-
        class Cls {
            foo<T>(p: T): T {
                return p
            }
        }
      use: |-
        let z = new Cls().foo<number[]>([1])
        arktest.assertTrue(z[0] instanceof number)
