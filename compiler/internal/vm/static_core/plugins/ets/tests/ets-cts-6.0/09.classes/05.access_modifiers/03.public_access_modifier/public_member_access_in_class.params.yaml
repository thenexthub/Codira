---
tests:
  - class: |-
      class A {
        public x: int = 1
        foo(): int {
          return this.x
        }
      }

  - class: |-
      class A {
        public static x: int = 1
        foo(): int {
          return A.x
        }
      }

  - class: |-
      class A {
        public getValue(): int {
          return 1
        }
        foo(): int {
          return this.getValue()
        }
      }

  - class: |-
      class A {
        public static getValue(): int {
          return 1
        }
        foo(): int {
          return A.getValue()
        }
      }

  - class: |-
      class A {
        public _val: int = 1
        public get val(): int {
          return this._val
        }
        foo(): int {
          return this.val
        }
      }

  - class: |-
      class A {
        public static _val: int = 1
        public static get val(): int {
          return A._val
        }
        foo(): int {
          return A.val
        }
      }

  - class: |-
      class A {
        public _val: int = 0
        public set val(i: int) {
          this._val = i
        }
        foo(): int {
          this.val = 1
          return this._val
        }
      }

  - class: |-
      class A {
        public static _val: int = 0
        public static set val(i: int) {
          A._val = i
        }
        foo(): int {
          A.val = 1
          return A._val
        }
      }
