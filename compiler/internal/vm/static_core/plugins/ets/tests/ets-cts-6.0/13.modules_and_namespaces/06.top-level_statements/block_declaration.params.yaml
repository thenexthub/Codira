--- # A list of top level statements
statements:
  - block: '["hello", "world"]'
  - block: 'let i: int = 1;'
  - block: |-
          if (check())
            arktest.assertTrue(true);
  - block: 'const b: int = 1;'
  - block: |-
          let i: int = 1;
          do i++; while (i < 10)
            x = i;
  - block: |-
          let i: int = 1;
          while (i < 10) i++
            x = i;
  - block: |-
          for (let i: int = 0; i < 10; i++) {
            x = i;
          }
  - block: |-
          let arr: int[] = new int[0]
          for (let v: int of arr)
            x = v;
  - block: |-
          switch (x) {
            case 0: { arktest.assertEQ( x, 0 ); break; }
            case 1: { arktest.assertEQ( x, 1 ); break; }
            case 2: { arktest.assertEQ( x, 2 ); break; }
          default: { arktest.assertTrue( false ); break; }
          }
  - block: 'arktest.assertTrue( true )'
  - block: |-
          try {
            throw new Error();
          } catch (e) {
            x = 0;
          }
