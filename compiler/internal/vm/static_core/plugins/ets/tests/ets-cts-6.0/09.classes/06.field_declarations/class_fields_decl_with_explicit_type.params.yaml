      - {check_type: "boolean",
        base_value: "false", new_value: "true"}
      - {check_type: "Object | undefined",
        base_value: "undefined", new_value: "5"}
      - {check_type: "Object | undefined | null",
        base_value: "undefined", new_value: "5"}
      - {check_type: "Any",
        base_value: "undefined", new_value: "5"}
    decl_variants:
      - |-
        class A {
          private _field: [check_type]
          get field(): [check_type] {
