---
cases:
  - |-
      let a1: A = new A()
      arktest.assertTrue(a1.m() instanceof B)
      a1 = new C()
      arktest.assertTrue(a1.m() instanceof D)

  - |-
      let a1: A = getA()
      arktest.assertTrue(a1.m() instanceof B)
      let a2: A = getC()
      arktest.assertTrue(a2.m() instanceof D)

  - |-
      let a1: A = (() => new A)()
      arktest.assertTrue(a1.m() instanceof B)
      let a2: A = (() => new C)()
      arktest.assertTrue(a2.m() instanceof D)
