cases:
  - { type: byte, val: 42, len: 42 }
  - { type: short, val: '0xff', len: 255 }
  - { type: Byte, val: new Byte(127 as byte), len: 127 }
  - { type: Short, val: new Short(0x1ff), len: 511 }
  - { type: Int, val: new Int(129), len: 129 }
  - { type: float, val: 10.0f, len: 10 }
  - { type: double, val: 20.0, len: 20 }
  - { type: Float, val: new Float(1.0f), len: 1 }
  - { type: Double, val: new Double(2.0), len: 2 }
