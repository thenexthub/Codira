---
cases:
    - use: |-
          // empty try block
          try {} catch (e) { }
          arktest.assertEQ(t1, 1)

    - use: |-
          // empty catch block
          try {
              if (t1 != t2) throw new Er()
          } catch (e) {
          } finally {
              arktest.assertEQ(t1, 1)
          }

    - use: |-
          // empty finally block
          try {
              if (t1 != t2) throw new Er()
          } catch (e) {
              arktest.assertEQ(t1, 1);
          } finally {
          }

    - use: |-
          let res = 0
          try {
              // no catch block, Error thrown
              try {
                  if (t1 != t2) throw new Er()
              } finally {
                  res = 1
              }
          } catch (e) {
              	arktest.assertTrue(e instanceof Error)
                arktest.assertEQ(res, 1)
          }


    - use: |-
          let obj: Object|null = null
          // no finally block, Error thrown
          try {
            if (t1 != t2) throw new Er();
          } catch (e) {
            obj = e
          }
          arktest.assertTrue(obj instanceof Error)
