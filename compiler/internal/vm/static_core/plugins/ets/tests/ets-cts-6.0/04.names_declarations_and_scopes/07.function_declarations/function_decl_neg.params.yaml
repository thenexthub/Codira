--- # List of invalid function declarations
function_decls:
    # missing return type
    - { decl: 'function f(): {}', call: 'f();' }

    # missing name
    - { decl: 'let f = function (): void {}', call: 'f();' }
    - { decl: 'function (): void {}', call: '' }

    # keyword as name
    - { decl: 'function import() {}', call: '' }
    - { decl: 'function case(): number { return 0.0 }', call: '' }

    # missing parameters
    - { decl: 'function f: void {}', call: 'f();' }
    - { decl: 'function f(: void {}', call: 'f();' }
    - { decl: 'function f): void {}', call: 'f();' }

    # missing colon
    - { decl: 'function f() void {}', call: 'f();' }

    # missing body
    - { decl: 'function f(): void', call: 'f();' }
    - { decl: 'function f(): void {', call: 'f();' }
    - { decl: 'function f(): void }', call: 'f();' }

    # temp CTE for Initializer of arrowFunc array
    - decl: |-
          type BarType = () => void
          function bar() {}
          function foo(): BarType[] {
              let arr: BarType[] = new BarType[1]
              arr[0] = bar
              return arr;
          }
      call: |-
          let f: BarType[] = foo();
          arktest.assertTrue( f instanceof Array && f.length == 1 )

    # no params, return enum array
    - decl: |-
          enum Color { Red, Green, Blue }
          function foo(): Color[] {
              let arr: Color[] = new Color[1]
              arr[0] = Color.Red
              return arr;
          }
      call: |-
          let arr: Color[] = foo();
          arktest.assertTrue( arr instanceof Array && arr.length == 1 && arr[0] == Color.Red )
