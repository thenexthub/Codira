---
cases:
    # regular lambda cases as baseline for trailing lambda
    - decl: |-
          let globl: number = 0.0
          function foo(n: number, f: () => void) {
              f()
              globl += n
          }
      use: |-
          // regular lambda
          foo(10.0, () => {
              globl = 3.0
          })
          arktest.assertEQ( globl, 13.0 )

    - decl: |-
          type FF = () => void
          let globl: number = 0.0
          function foo(n: number, f?: FF) { // optional
              f?.()
              globl += n
          }
      use: |-
          // regular lambda
          foo(10.0, () => {
              globl = 3.0
          })
          arktest.assertEQ( globl, 13.0 )

          foo(10.0)
          arktest.assertEQ( globl, 23.0 )

    # trailing lambda cases
    - decl: |-
          type FF = () => void
          let globl: number = 0.0
          function foo(n: number, f: FF) {
              f()
              globl += n
          }
      use: |-
          foo(10.0)  // trailing lambda
          {
              globl = 3.0
          }
          arktest.assertEQ( globl, 13.0 )

    - decl: |-
          let globl: number = 0.0
          function foo(n: number, f?: () => void) { // optional
              f?.()
              globl += n
          }
      use: |-
          foo(10.0)  // trailing lambda
          {
              globl = 3.0
          }
          arktest.assertEQ( globl, 13.0 )

          foo(10.0)
          arktest.assertEQ( globl, 23.0 )

    # regular lambda cases with extra block afterwards
    - decl: |-
          let globl: number = 0.0
          function foo(n: number, f: () => void) {
              f()
              globl += n
          }
      use: |-
          // regular lambda
          foo(10.0, () => { globl = 3.0 })
          {
              globl = 4.0
          }
          arktest.assertEQ( globl, 4.0 )

    - decl: |-
          let globl: number = 0.0
          function foo(n: number, f?: () => void) { // optional
              f?.()
              globl += n
          }
      use: |-
          // regular lambda
          foo(10.0, () => { globl = 3.0 })
          {
              globl = 4.0
          }
          arktest.assertEQ( globl, 4.0 )

          foo(10.0) // trailing lambda
          {
              globl = 5.0
          }
          arktest.assertEQ( globl, 15.0 )

          foo(10.0)  // no trailing lambda
          arktest.assertEQ( globl, 25.0 )

    # regular lambda cases with extra block afterwards separated by a semicolon
    - decl: |-
          let globl: number = 0.0
          function foo(n: number, f: () => void) {
              f()
              globl += n
          }
      use: |-
          // not a trailing lambda, block separated by semicolon
          foo(10.0, () => { globl = 3.0 }); { globl = 4.0 }
          arktest.assertEQ( globl, 4.0 )

    - decl: |-
          let globl: number = 0.0
          function foo(n: number, f?: () => void) { // optional
              f?.()
              globl += n
          }
      use: |-
          // not a trailing lambda, block separated with semicolon
          foo(10.0, () => { globl = 3.0 }); { globl = 4.0 }
          arktest.assertEQ( globl, 4.0 )

          foo(10.0) { globl = 13.0 }  // trailing lambda
          arktest.assertEQ( globl, 23.0 )

          foo(10.0); { globl = 13.0 } // not a trailing lambda
          arktest.assertEQ( globl, 13.0 )

    # case without last function parameter with extra block afterwards separated by a semicolon
    - decl: |-
          let globl: number = 0.0
          function foo(n: number) {
              globl += n
          }
      use: |-
          globl = 1.0
          foo(10.0); { globl = 4.0 } // no last function parameter
          arktest.assertEQ( globl, 4.0 )

    # trailing lambda as function argument
    - decl: |-
          type FF = () => void
          let globl: number = 0.0
          function foo(n: number, f: FF): number {
              f()
              return globl + n
          }
      use: |-
          globl = 0.0
          arktest.assertEQ( foo(foo(3.0) { globl = 6.0 }) { globl = 2.0 }, 11.0 )

    - decl: |-
          type FF = () => void
          let globl: string = ""
          function foo(s: string, f: FF): string {
              f()
              return globl += s
          }
      use: |-
          globl = ""
          arktest.assertEQ( foo(foo("A") { globl += "B" }) { globl += "C" }, "BACBA" )

    - decl: |-
          type FF = () => void
          let globl: number = 0.0
          function foo(n: number, f?: FF): number { // optional
              f?.()
              return globl + n
          }
      use: |-
          globl = 0.0
          arktest.assertEQ( foo(foo(3.0) 
              {
                  globl = 6.0
              }
          ) { globl = 2.0 }, 11.0 )

          globl = 0.0
          arktest.assertEQ( foo(foo(3.0) {}) {}, 3.0 )
          arktest.assertEQ( foo(foo(3.0)) { globl = 1.0 }, 4.0 )
          arktest.assertEQ( foo(foo(3.0) { globl = 1.0 }), 5.0 )

    - decl: |-
          type FF = () => void
          let globl: string = ""
          function foo(s: string, f?: FF): string { // optional
              f?.()
              return globl += s
          }
      use: |-
          globl = ""
          arktest.assertEQ( foo(foo("A") { globl += "B" }) { globl += "C" }, "BACBA" )

          globl = ""
          arktest.assertEQ( foo(foo("A")) {
              globl += "C"
          }, "ACA" )

          globl = ""
          arktest.assertEQ( foo(foo("A") { globl += "B" }), "BABA" )

          globl = ""
          arktest.assertEQ( foo(foo("A")), "AA" )

    # trailing lambda in object literal
    - decl: |-
          let globl = 0.0
          function foo(n: number, f: () => void) {
              f()
              return globl += n
          }
          class A {
              fld1: number
              fld2: number
          }
      use: |-
          globl = 0.0
          let v: A = { fld1: foo(1.0) { globl = 3.0 }, fld2: foo(2.0) { globl += 5.0 } }
          arktest.assertTrue( v.fld1 == 4.0 && v.fld2 == 11.0 )

    # trailing lambda in template literals
    - decl: |-
          let globl = ""
          function foo(s: string, f?: () => void): string {
              f?.()
              return globl + s
          }
      use: |-
          globl = ""
          let s = `abc ${foo("A") { globl = "Z" }} def ${foo("B")} ghi ${foo("C") {}} jkl`
          arktest.assertEQ( s, "abc ZA def ZB ghi ZC jkl" )

    # multiple lambda in parameters
    - decl: |-
          type FF = () => void
          let g1 = 0.0
          let g2 = 0.0
          function foo(f1: FF, f2?: FF): number {
              f1()
              f2?.()
              return g1 + 10.0 * g2
          }
      use: |-
          g1 = 0.0
          g2 = 0.0
          arktest.assertEQ( foo(() => { g1 = 2.0 }, () => { g2 = 4.0 }), 42.0 )
          g1 = 0.0
          g2 = 0.0
          arktest.assertEQ( foo(() => { g1 = 2.0 }) { g2 = 4.0 }, 42.0 )
          g1 = 0.0
          g2 = 0.0
          arktest.assertEQ( foo(() => { g1 = 2.0 }), 2.0 )

    # optional parameters before optional trailing lambda, may be skipped
    - decl: |-
        type StringProvider = () => string
        
        function foo(val1: String, val2?: String, lf?: StringProvider): string {
            return `${val1} ${val2} ${lf?.()}`
        }

      use: |-
        let result = foo('Hello', 'World', () => 'of Trailing Lambdas')
        arktest.assertEQ('Hello World of Trailing Lambdas', result);
        
        result = foo('Hello') {
          return 'of Trailing Lambdas'
        }
        arktest.assertEQ('Hello undefined of Trailing Lambdas', result);
        
        result = foo('Hello'); {
          // This is not a trailing lambda block
        }
        arktest.assertEQ('Hello undefined undefined', result);

    # optional parameters before optional trailing lambda, may be skipped
    - decl: |-
        type StringProvider = () => string
        
        function boo(val1: String, val2: String = 'Missed', lf?: StringProvider): string {
            return `${val1} ${val2} ${lf?.()}`
        }

      use: |-
        let result = boo('Hello', 'World', () => 'of Trailing Lambdas')
        arktest.assertEQ('Hello World of Trailing Lambdas', result);
        
        result = boo('Hello') {
          return 'of Trailing Lambdas'
        }
        arktest.assertEQ('Hello Missed of Trailing Lambdas', result);

        result = boo('Hello'); {
          // This is not a trailing lambda block
        }
        arktest.assertEQ('Hello Missed undefined', result);

    # optional parameters before optional trailing lambda, may be skipped
    - decl: |-
        type StringProvider = () => string
        const stub: StringProvider = () => 'I am Stub'
        
        function roo(val1: String, val2: String = 'Missed', lf: StringProvider = stub): string {
            return `${val1} ${val2} ${lf?.()}`
        }

      use: |-
        let result = roo('Hello', 'World', () => 'of Trailing Lambdas')
        arktest.assertEQ('Hello World of Trailing Lambdas', result);
        
        result = roo('Hello'); {
          // This is not a trailing lambda block
        }
        arktest.assertEQ('Hello Missed I am Stub', result);
