--- # List of Invalid int literals
cases:
    - { lit: '0xffffffff' }
    - { lit: '0x80000000' }
    - { lit: '0xca_fe_CA_FE' }
    - { lit: '0X00_00_00_00_ca_fe_CA_FE' }
    - { lit: '0xa_Ab_Bc_Cd_D' }
    - { lit: '0O37777777777' }
    - { lit: '0O20000000000' }
    - { lit: '0B11111111111111111111111111111111' }
    - { lit: '0b10000000000000000000000000000000' }
    - { lit: '0B1010_1010_1010_1010_1010_1010_1010_1010' }