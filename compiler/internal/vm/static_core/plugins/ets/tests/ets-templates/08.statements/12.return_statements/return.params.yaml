--- # List of valid expression statements
block_statements:
  - decl: |
      function foo(): void { return }
    use: |
      foo()
  - decl: |
      function foo() { return }
    use: |
      foo()
  - decl: |
      class A {
        foo(): void { return }
      }
    use: |
      new A().foo()
  - decl: |
      class A {
        foo() { return }
      }
    use: |
      new A().foo()
  - decl: |
      class A {
        public static x: int
        static {
          A.x = 5
          return
        }
      }
    use: |
      A.x
  - decl: |
      class A {
        constructor() {
          return
        }
      }
    use: |
      new A()
  - decl: |
      function test(): void {
        return;
        arktest.assertTrue(true); // DTS2025032419456 Checks that unreachable statements after return doesn't cause compilation failure
      }
    use: |
      test()

  - decl: |
      type TL = () => void

    use: |
      let x: TL = () => { return }
      x()

  - decl: |
      type TL = () => void

    use: |
      ((): void => { return })()
