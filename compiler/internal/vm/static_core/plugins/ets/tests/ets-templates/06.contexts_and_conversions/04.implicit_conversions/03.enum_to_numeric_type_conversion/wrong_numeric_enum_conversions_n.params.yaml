---
cases:
    - enum_values: '{ First, Second = 100, Third }'
    - enum_values: '{ First = 0.2f, Second = 10.1f, Third = 3.3f }'
    - enum_values: '{ First = 100.0, Second = 10.0, Third = -0.0 }' 
    - enum_values: '{ First, Second = 0x3434343456565656, Third }' 

non_numeric_types:
    - String
    - BigInt
    - Array<Any>
    - Boolean
    - 'Null'
    - Function
    - Char
    - Record<Int,Int>
    - Boolean|String
