---
cases:
  - decl: |-
      class A {
        static i: int = 0
        j: int = 0
      }
    check: |-
      let a: Partial<A> = {j:2}
      arktest.assertEQ(a.j, 2)

  - decl: |-
      abstract class AC {
        static i: int = 0
        j: int = 0
      }
    check: |-
      let a: Partial<AC> = {j:2}
      arktest.assertEQ(a.j, 2)

  - decl: |-
      let firstrun = true
      class A {
        static i: int = 1
        j: int = 0
      }
      type P = Partial<A>
    check: |-
      let a: P = {j:2}
      if(firstrun) {
        arktest.assertEQ(P.i, undefined)
        P.i = 3
        firstrun = false
      }
      arktest.assertEQ(P.i, 3)
      arktest.assertEQ(A.i, 1)
    doc: |-
      Static field is a part of Partial<T> class. Field becomes optional and, thus, gets undefined value.

  - decl: |-
      let firstrun = true
      abstract class AC {
        static i: int = 2
        j: int = 0
      }
      type P = Partial<AC>
    check: |-
      let a: P = {j:2}
      if(firstrun) {
        arktest.assertEQ(P.i, undefined)
        P.i = 3
        firstrun = false
      }
      arktest.assertEQ(P.i, 3)
      arktest.assertEQ(AC.i, 2)
    doc: |-
      Static field is a part of Partial<T> class. Field becomes optional and, thus, gets undefined value.
