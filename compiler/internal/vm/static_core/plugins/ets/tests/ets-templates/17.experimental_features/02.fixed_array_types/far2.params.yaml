---
types:
    - byte
    - short
    - int
    - long
    - float
    - double
    - char
    - boolean
    - string

cases:
    - type: byte
      vals: '(0x80).toByte(), (0x7f).toByte()'

    - type: short
      vals: '(0x8000).toShort(), (0x7fff).toShort()'

    - type: int
      vals: '0x7fffffff, 0x7fffffff'

    - type: long
      vals: '0x7fffffffffffffff, 0x7fffffffffffffff'

    - type: float
      vals: '1.0f, 2.0f'

    - type: double
      vals: '1.0, 2.0'

    - type: string
      vals: "'a', 'b'"

    - type: char
      vals: "c'a', c'b'"

    - type: boolean
      vals: 'true, false'
