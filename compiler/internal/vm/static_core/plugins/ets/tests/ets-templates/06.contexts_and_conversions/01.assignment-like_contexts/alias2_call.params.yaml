---
cases:

  - type: short
    ref_type: Byte
    values: [new Byte(-128 as byte), new Byte(0 as byte), new Byte(127 as byte)]

  - type: int
    ref_type: Byte
    values: [new Byte(-128 as byte), new Byte(0 as byte), new Byte(127 as byte)]

  - type: long
    ref_type: Byte
    values: [new Byte(-128 as byte), new Byte(0 as byte), new Byte(127 as byte)]

  - type: float
    ref_type: Byte
    values: [new Byte(-128 as byte), new Byte(0 as byte), new Byte(127 as byte)]

  - type: double
    ref_type: Byte
    values: [new Byte(-128 as byte), new Byte(0 as byte), new Byte(127 as byte)]


  - type: int
    ref_type: Short
    values: [new Short(Short.MIN_VALUE), new Short((255).toShort())]

  - type: long
    ref_type: Short
    values: [new Short(Short.MIN_VALUE), new Short((255).toShort())]

  - type: float
    ref_type: Short
    values: [new Short(Short.MIN_VALUE), new Short((255).toShort())]

  - type: double
    ref_type: Short
    values: [new Short(Short.MIN_VALUE), new Short((255).toShort())]


  - type: long
    ref_type: Int
    values: [new Int(127), new Int(32767), new Int(Int.MAX_VALUE)]

  - type: float
    ref_type: Int
    values: [new Int(127), new Int(32767), new Int(Int.MAX_VALUE)]

  - type: double
    ref_type: Int
    values: [new Int(127), new Int(32767), new Int(Int.MAX_VALUE)]


  - type: float
    ref_type: Long
    values: [new Long(Long.MIN_VALUE), new Long((9223372036854775807).toLong())]

  - type: double
    ref_type: Long
    values: [new Long(Long.MIN_VALUE), new Long((9223372036854775807).toLong())]


  - type: double
    ref_type: Float
    values: [new Float(1.401298464324817e-45f), new Float(Float.MAX_VALUE)]
