---
cases:
    - doc: Access protected method
      decl: |-
        class C {
          protected count(): number {
            return 1
          }
          static getCount(c: C): number {
            return c.count()
          }
        }
        function main() {
          let c: C = new C()
          arktest.assertEQ(C.getCount(c), 1)
        }

    - doc: Access inherited protected method
      decl: |-
        class B {
          protected count(): number {
            return 1
          }
        }
        class C extends B {
          static getCount(c: C): number {
            return c.count()
          }
        }
        function main() {
          let c: C = new C()
          arktest.assertEQ(C.getCount(c), 1)
        }

    - doc: Access derived protected method
      decl: |-
        class B {
          protected count(): number {
            return 1
          }
          static getCount(c: C): number {
            return c.count()
          }
        }
        class C extends B { }
        function main() {
          let c: C = new C()
          arktest.assertEQ(B.getCount(c), 1)
        }

    - doc: Access protected method from local variable
      decl: |-
        class C {
          protected count(): number {
            return 1
          }
          static getCount(i: number): number {
            let c: C = new C()
            return c.count() + i
          }
        }
        function main() {
          arktest.assertEQ(C.getCount(2), 3)
        }

    - doc: Access derived protected method from local variable
      decl: |-
        class B {
          protected count(): number {
            return 1
          }
          static getCount(i: number): number {
            let c: C = new C()
            return c.count() + i
          }
        }
        class C extends B { }
        function main() {
          arktest.assertEQ(C.getCount(2), 3)
        }

    - doc: Access private method
      decl: |-
        class C {
          private count(): number {
            return 1
          }
          static getCount(c: C): number {
            return c.count()
          }
        }
        function main() {
          let c: C = new C()
          arktest.assertEQ(C.getCount(c), 1)
        }

    - doc: Access private method by derived class instance
      decl: |-
        class B {
          private count(): number {
            return 1
          }
          static getCount(c: C): number {
            return c.count()
          }
        }
        class C extends B { }
        function main() {
          let c: C = new C()
          arktest.assertEQ(B.getCount(c), 1)
        }

    - doc: Access private method from local variable
      decl: |-
        class C {
          private count(): number {
            return 1
          }
          static getCount(i: number): number {
            let c: C = new C()
            return c.count() + i
          }
        }
        function main() {
          arktest.assertEQ(C.getCount(2), 3)
        }

    - doc: Access derived private method from local variable
      decl: |-
        class B {
          private count(): number {
            return 1
          }
          static getCount(i: number): number {
            let c: C = new C()
            return c.count() + i
          }
        }
        class C extends B { }
        function main() {
          arktest.assertEQ(C.getCount(2), 3)
        }
