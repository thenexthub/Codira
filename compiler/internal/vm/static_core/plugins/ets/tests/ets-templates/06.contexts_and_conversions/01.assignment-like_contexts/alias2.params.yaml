---
cases:

  - src_type: Byte
    dst_type: Short
    values: [-128 as byte, 0 as byte, 127 as byte]

  - src_type: Byte
    dst_type: Int
    values: [-128 as byte, 0 as byte, 127 as byte]

  - src_type: Byte
    dst_type: Long
    values: [-128 as byte, 0 as byte, 127 as byte]

  - src_type: Byte
    dst_type: Float
    values: [-128 as byte, 0 as byte, 127 as byte]

  - src_type: Byte
    dst_type: Double
    values: [-128 as byte, 0 as byte, 127 as byte]

  - src_type: Short
    dst_type: Int
    values: [(-32768).toShort(), (-128).toShort(), (0).toShort()]

  - src_type: Short
    dst_type: Long
    values: [(-32768).toShort(), (-128).toShort(), (0).toShort()]

  - src_type: Short
    dst_type: Float
    values: [(-32768).toShort(), (-128).toShort(), (0).toShort()]

  - src_type: Short
    dst_type: Double
    values: [(-32768).toShort(), (-128).toShort(), (0).toShort()]


  - src_type: Int
    dst_type: Long
    values: [127, 32767, 2147483647]

  - src_type: Int
    dst_type: Float
    values: [127, 32767]

  - src_type: Int
    dst_type: Double
    values: [127, 32768]

  - src_type: Long
    dst_type: Float
    values: [(-1).toLong(), (0).toLong(), (1).toLong()]

  - src_type: Long
    dst_type: Double
    values: [(-128).toLong(), (127).toLong()]

  - src_type: Float
    dst_type: Double
    values: [1.4e-10f, 0.0000001f]
