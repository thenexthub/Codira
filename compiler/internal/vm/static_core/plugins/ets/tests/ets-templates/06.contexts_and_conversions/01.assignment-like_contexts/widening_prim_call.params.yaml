---
cases:
  - ctype: short
    values:
      - { type: byte, val: 0, val2: ((0).toShort()) }
      - { type: byte, val: 127, val2: ((127).toShort()) }
      - { type: byte, val: -128, val2: ((-128).toShort()) }

  - ctype: int
    values:
      - { type: byte, val: 0, val2: 0 }
      - { type: byte, val: 127, val2: 127 }
      - { type: byte, val: -128, val2: -128 }
      - { type: char, val: Int.toChar(0), obj_param_trans: "Char.toInt", val2: 0 }
      - { type: char, val: "c'\\uFFFF'", obj_param_trans: "Char.toInt", val2: 0x0000FFFF }
      - { type: short, val: 0, val2: 0 }
      - { type: short, val: 32_767, val2: 32_767 }
      - { type: short, val: -32_768, val2: -32_768 }

  - ctype: long
    values:
      - { type: byte, val: 0, val2: ((0).toLong())}
      - { type: byte, val: 127, val2: ((127).toLong()) }
      - { type: byte, val: -128, val2: ((-128).toLong()) }
      - { type: char, val: Int.toChar(0), obj_param_trans: "Char.toLong", val2: ((0).toLong()) }
      - { type: char, val: "c'\\uFFFF'", obj_param_trans: "Char.toLong", val2: ((0x000000000000FFFF).toLong()) }
      - { type: short, val: 0, val2: ((0).toLong()) }
      - { type: short, val: 32_767, val2: ((32_767).toLong()) }
      - { type: short, val: -32_768, val2: ((-32_768).toLong()) }
      - { type: int, val: 0, val2: ((0).toLong()) }
      - { type: int, val: 2147483647, val2: ((2147483647).toLong()) }
      - { type: int, val: -2147483648, val2: ((-2147483648).toLong()) }

  - ctype: float
    values:
      - { type: byte, val: 0, val2: (0.0f) }
      - { type: byte, val: 127, val2: (127.0f) }
      - { type: byte, val: -128, val2: (-128.0f) }
      - { type: char, val: Int.toChar(0), obj_param_trans: "Char.toFloat", val2: (0.0f) }
      - { type: char, val: "c'\\uFFFF'", obj_param_trans: "Char.toFloat", val2: (65535.0f)}
      - { type: short, val: 0, val2: (0.0f) }
      - { type: short, val: 32_767, val2: (32_767.0f) }
      - { type: short, val: -32_768, val2: (-32_768.0f) }
      - { type: int, val: 0, val2: (0.0f) }
      - { type: int, val: 2147483647, val2: (2.147483648e9f)}
      - { type: int, val: -2147483648, val2: (-2.147483648e9f) }
      - { type: long, val: 0, val2: (0.0f)}
      - { type: long, val: 9223372036854775807, val2: (9.223372036854776e18f)}
      - { type: long, val: -9223372036854775808, val2: (-9.223372036854776e18f)}

  - ctype: double
    values:
      - { type: byte, val: 0, val2: 0.0 }
      - { type: byte, val: 127, val2: 127.0 }
      - { type: byte, val: -128, val2: -128.0 }
      - { type: char, val: Int.toChar(0), obj_param_trans: "Char.toDouble", val2: 0.0 }
      - { type: char, val: "c'\\uFAFF'", obj_param_trans: "Char.toDouble", val2: 64255.0 }
      - { type: short, val: 0, val2: 0.0 }
      - { type: short, val: 32_767, val2: 32_767.0 }
      - { type: short, val: -32_768, val2: -32_768.0 }
      - { type: int, val: 0, val2: 0.0 }
      - { type: int, val: 2147483647, val2: 2.147483647e9 }
      - { type: int, val: -2147483648, val2: -2.147483648e9 }
      - { type: long, val: 0, val2: 0.0 }
      - { type: long, val: 9223372036854775807, val2: 9.223372036854776e18 }
      - { type: long, val: -9223372036854775808, val2: -9.223372036854776e18 }
      - { type: float, val: 0.0f, val2: 0.0f }
        # +max
      - { type: float, val: 3.4028234663852886e38f, val2: 3.4028234663852886e38f }
        # +min
      - { type: float, val: 1.401298464324817e-45f, val2: 1.401298464324817e-45f }
        # -max
      - { type: float, val: -3.4028234663852886e38f, val2: -3.4028234663852886e38f }
        # -min
      - { type: float, val: -Float.MIN_VALUE, val2: -Float.MIN_VALUE }
