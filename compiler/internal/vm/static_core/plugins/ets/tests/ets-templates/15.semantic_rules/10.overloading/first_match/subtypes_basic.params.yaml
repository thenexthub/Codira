---
cases:
  - type_1: Any
    type_2: "null"
    assert_direct_1: foo(new Object), "foo1"   
    assert_direct_2: foo(null), "foo1"
    assert_reverse_1: bar(new Object), "bar2"
    assert_reverse_2: bar(null), "bar1"
  - type_1: Object
    type_2: "null"
    assert_direct_1: foo(new Object), "foo1"
    assert_direct_2: foo(null), "foo2"
    assert_reverse_1: bar(new Object), "bar2"
    assert_reverse_2: bar(null), "bar1"
  - type_1: undefined
    type_2: "null"
    assert_direct_1: foo(undefined), "foo1"
    assert_direct_2: foo(null), "foo2"
    assert_reverse_1: bar(undefined), "bar2"
    assert_reverse_2: bar(null), "bar1"
