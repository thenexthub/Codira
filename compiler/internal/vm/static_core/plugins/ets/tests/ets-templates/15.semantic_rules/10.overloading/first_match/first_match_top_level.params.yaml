---
cases:
    - descr: Simple overload
      decl: |-
        function foo(v1: number, v2: string): number { return 1 }
        function foo(v1: string, v2: number): number { return 2 }
      call: |-
        arktest.assertEQ(foo(1, 'str'), 1, 'foo1 call expected');
        arktest.assertEQ(foo('str', 1), 2, 'foo2 call expected');

    - descr: Multiple overload
      decl: |-
        function foo(): number { return 1 }
        function foo(v1: string): string { return '2' }
        function foo(v1: string, v2: number): number { return 3 }
        function foo(v1: string, v2: number, v3: string): string { return '4' }
        function foo(v1: number, v2: string): number { return 5 }
      call: |-
        arktest.assertEQ(foo(), 1, 'foo1 call expected');
        arktest.assertEQ(foo('str'), '2', 'foo2 call expected');
        arktest.assertEQ(foo('str', 1), 3, 'foo3 call expected');
        arktest.assertEQ(foo('str', 1, 'str'), '4', 'foo4 call expected');
        arktest.assertEQ(foo(1, 'str'), 5, 'foo5 call expected');

    - descr: Simple overload with rest param
      decl: |-
        function foo(v1: number): number { return 1 }
        function foo(v1: number, ...v2: number[]): number { return 2 }
      call: |-
        arktest.assertEQ(foo(1), 1, 'foo1 call expected');
        arktest.assertEQ(foo(1, 2), 2, 'foo2 with rest param call expected');

    - descr: Simple overload of rest param
      decl: |-
        function foo(v1: number, ...v2: number[]): number { return 1 }
        function foo(v1: number): number { return 2 }
      call: |-
        arktest.assertEQ(foo(1), 1, 'foo1 call expected');
        arktest.assertEQ(foo(1, 2), 1, 'foo1 with rest param call expected');

    - descr: Simple overload with optional param
      decl: |-
        function foo(v1: number): number { return 1 }
        function foo(v1: number, v2: number = 3): number { return 2 }
      call: |-
        arktest.assertEQ(foo(1), 1, 'foo1 call expected');
        arktest.assertEQ(foo(1, 2), 2, 'foo2 with optional param call expected');

    - descr: Simple overload of optional param
      decl: |-
        function foo(v1: number, v2: number = 3): number { return 1 }
        function foo(v1: number): number { return 2 }
      call: |-
        arktest.assertEQ(foo(1), 1, 'foo1 call expected');
        arktest.assertEQ(foo(1, 2), 1, 'foo1 with optional param call expected');

    - descr: Simple overload
      decl: |-
        class A1 {}
        class A2 extends A1 {}
        function foo(v: A2): string { return 'foo with A2' }
        function foo(v: A1): string { return 'foo with A1' }
      call: |-
        let a1 = new A1;
        let a2 = new A2;
        arktest.assertEQ(foo(a1), 'foo with A1', 'foo2 call expected');
        arktest.assertEQ(foo(a2), 'foo with A2', 'foo1 call expected');

    - descr: Simple overload
      decl: |-
        class A1 {}
        class A2 extends A1 {}
        function foo(v: A1): string { return 'foo with A1' }
        function foo(v: A2): string { return 'foo with A2' }
      call: |-
        let a1 = new A1;
        let a2 = new A2;
        arktest.assertEQ(foo(a1), 'foo with A1', 'foo1 call expected');
        arktest.assertEQ(foo(a2), 'foo with A1', 'foo1 call expected');

    - descr: Multiple overload
      decl: |-
        class A1 {}
        class A2 extends A1 {}
        class A3 extends A2 {}
        function foo(v: A1): string { return 'foo with A1' }
        function foo(v: A3): string { return 'foo with A3' }
        function foo(v: A2): string { return 'foo with A2' }
      call: |-
        let a1 = new A1;
        let a2 = new A2;
        let a3 = new A3;
        arktest.assertEQ(foo(a1), 'foo with A1', 'foo1 call expected');
        arktest.assertEQ(foo(a2), 'foo with A1', 'foo1 call expected');
        arktest.assertEQ(foo(a3), 'foo with A1', 'foo1 call expected');

    - descr: Multiple overload
      decl: |-
        class A1 {}
        class A2 extends A1 {}
        class A3 extends A2 {}
        function foo(v: A3): string { return 'foo with A3' }
        function foo(v: A1): string { return 'foo with A1' }
        function foo(v: A2): string { return 'foo with A2' }
      call: |-
        let a1 = new A1;
        let a2 = new A2;
        let a3 = new A3;
        arktest.assertEQ(foo(a1), 'foo with A1', 'foo2 call expected');
        arktest.assertEQ(foo(a2), 'foo with A1', 'foo2 call expected');
        arktest.assertEQ(foo(a3), 'foo with A3', 'foo1 call expected');
