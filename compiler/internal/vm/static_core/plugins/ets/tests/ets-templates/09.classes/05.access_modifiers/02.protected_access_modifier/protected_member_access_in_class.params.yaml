---
tests:
  - doc: access protected field
    decl: |-
      class A {
        protected x: int = 7
        foo(): int {
          return this.x
        }
      }
    check: |-
      arktest.assertEQ(new A().foo(), 7)

  - doc: access protected static field
    decl: |-
      class A {
        protected static x: int = 7
        foo(): int {
          return A.x
        }
      }
    check: |-
      arktest.assertEQ(new A().foo(), 7)

  - doc: access protected method
    decl: |-
      class A {
        protected getValue(): int {
          return 1
        }
        foo(): int {
          return this.getValue()
        }
      }
    check: |-
      arktest.assertEQ(new A().foo(), 1)

  - doc: access protected static method
    decl: |-
      class A {
        protected static getValue(): int {
          return 1
        }
        foo(): int {
          return A.getValue()
        }
      }
    check: |-
      arktest.assertEQ(new A().foo(), 1)

  - doc: access protected getter
    decl: |-
      class A {
        protected _val: int = 0
        protected get val(): int {
          return this._val
        }
        foo(i: int): int {
          this._val = i
          return this.val
        }
      }
    check: |-
      arktest.assertEQ(new A().foo(7), 7)

  - doc: access protected static getter
    decl: |-
      class A {
        protected static _val: int = 0
        protected static get val(): int {
          return A._val
        }
        static set val(i: int) {
          A._val = i
        }
        foo(): int {
          return A.val
        }
      }
    check: |-
      A.val = 5
      arktest.assertEQ(new A().foo(), 5)

  - doc: access protected setter
    decl: |-
      class A {
        protected _val: int = 0
        protected set val(i: int) {
          this._val = i
        }
        foo(i: int): int {
          this.val = i
          return this._val
        }
      }
    check: |-
      arktest.assertEQ(new A().foo(4), 4)

  - doc: access protected static setter
    decl: |-
      class A {
        protected static _val: int = 0
        protected static set val(i: int) {
          A._val = i
        }
        foo(i: int): int {
          A.val = i
          return A._val
        }
      }
    check: |-
      arktest.assertEQ(new A().foo(6), 6)
