modules:
  - entity: |-
      x 
    use: |-
      x
    expected: |-
      1
  - entity: |-
      foo 
    use: |-
      foo()
    expected: |-
      0
  - entity: |-
      C 
    use: |-
      (new C()).y
    expected: |-
      2
  - entity: |-
      I
    decl: |-
      class A implements I {}
      let a: I = new A()
    use: |-
      a.zzz()
    expected: |-
      3
  - entity: |-
      D 
    use: |-
      (new D()).f
    expected: |-
      4

