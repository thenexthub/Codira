---
cases:
  - decl: |-
      interface I {
        readonly f: int
      }
      class C implements I {
        set f(i: int) {}
      }
    doc: utilize readonly parameter by implementing set method is not allowed

  - decl: |-
      interface I {
        readonly f: int
      }
      class C implements I {
        f: boolean = false
      }
    doc: incorrect field type

  - decl: |-
      interface I {
        readonly f: int
      }
      class C implements I {}
    doc: required property is not initialized
