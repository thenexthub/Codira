language = "C"
cpp_compat = true

include_guard = "CODIRA_RUNTIME_BINDINGS_H_"
include_version = false
sys_includes = ["stdbool.h", "stdint.h"]
no_includes = true

line_length = 100
tab_width = 4

[export]
prefix = "Codira"
# Rust-side page-protection bits (`codira_memory::pages`); Codira programs
# reach page allocation through the runtime, not through this header.
exclude = ["PROT_READ", "PROT_WRITE", "PROT_EXEC"]

[enum]
rename_variants = "QualifiedScreamingSnakeCase"

[parse]
parse_deps = true
include = ["codira_abi", "codira_memory", "codira_runtime", "codira_capi_utils"]
extra_bindings = ["codira_memory", "codira_capi_utils"]
