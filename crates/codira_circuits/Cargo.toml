[package]
name = "codira_circuits"
description = "Arithmetic and boolean circuits from Codira functions: zero-knowledge proofs (R1CS, Circom, Groth16 over BN254) for `oblivious` functions and synthesizable Verilog for `@target(fpga)` functions"
keywords = ["zero-knowledge", "r1cs", "verilog", "codira", "compiler"]
categories.workspace = true
version.workspace = true
authors.workspace = true
edition.workspace = true
documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
codira_hir = { version = "0.6.0-dev", path = "../codira_hir" }
codira_hir_input = { version = "0.6.0-dev", path = "../codira_hir_input" }
codira_syntax = { version = "0.6.0-dev", path = "../codira_syntax" }
codira_target = { version = "0.6.0-dev", path = "../codira_target" }
stacker = "0.1.23"
ark-bn254 = { version = "0.5.0", default-features = false, features = ["curve"] }
ark-ff = { version = "0.5.0", default-features = false, features = ["std"] }
ark-ec = { version = "0.5.0", default-features = false, features = ["std"] }
ark-relations = { version = "0.5.0", default-features = false, features = ["std"] }
ark-groth16 = { version = "0.5.0", default-features = false, features = ["std"] }
ark-snark = { version = "0.5.0", default-features = false }
ark-serialize = { version = "0.5.0", default-features = false, features = ["std"] }
ark-std = { version = "0.5.0", default-features = false, features = ["std"] }
getrandom = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
