[package]
name = "funis_elf"
version = "3.0.0"
edition = "2024"
rust-version = "1.95"
description = "The generic ELF linker of Funis (a fork of mold)"
authors = ["Rui Ueyama and the mold contributors", "Omnira"]
license = "MIT"
repository = "https://github.com/rui314/mold"
publish = false
build = "build.rs"

[lib]
path = "lib.rs"

[dependencies]
blake3.workspace = true
bstr.workspace = true
crc32fast.workspace = true
# Not hoisted: the workspace already has getrandom 0.2 for other crates.
getrandom = "0.4.3"
hashbrown.workspace = true
libc.workspace = true
memchr.workspace = true
funis_common = { version = "3.0.0", path = "../funis_common" }
portable-atomic.workspace = true
rayon.workspace = true
uuid.workspace = true
xxhash-rust.workspace = true

[build-dependencies]
cc = "1"
